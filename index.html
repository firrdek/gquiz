<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CityQuiz – Find cities on the world map</title>
    <meta name="description" content="CityQuiz – a daily geography game where you guess cities on a world map. Score points by placing pins as close as possible!" />
    <meta name="keywords" content="city quiz, geography game, map quiz, world cities, daily quiz" />
    <link rel="canonical" href="https://redgoat.fun/" />

    <!-- Open Graph / Social media -->
    <meta property="og:title" content="CityQuiz – find the city on the map" />
    <meta property="og:description" content="Guess where five cities are located on the world map. New cities every day – how many points can you score?" />
    <meta property="og:url" content="https://redgoat.fun/" />
    <meta property="og:type" content="website" />

    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "CityQuiz",
      "description": "A daily geography quiz where you find cities on the world map.",
      "url": "https://redgoat.fun/",
      "applicationCategory": "GameApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "SEK"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Bas ─────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
        touch-action: manipulation;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #292524;
      }

      #root {
        width: 100vw;
        height: 100vh;
      }

      /* ── Karta ─────────────────────────────────── */
      .map-container {
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* ── Start page cards ──────────────────────── */
      .app-card {
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .app-card:hover {
        transform: scale(1.03);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
      }

      @media (max-width: 640px) {
        .card-grid {
          padding: 16px;
          gap: 16px;
        }
        .card-grid h1 {
          font-size: 26px;
        }
      }

      /* ── Responsiv tabell ──────────────────────── */
      @media (max-width: 480px) {
        .result-table th,
        .result-table td {
          font-size: 12px !important;
          padding: 6px 6px !important;
        }
        .result-table .city-cell {
          font-size: 11px !important;
          word-break: break-word;
        }
        .result-table .country-label {
          display: block;
          font-size: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
